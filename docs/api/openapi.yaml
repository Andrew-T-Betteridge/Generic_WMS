openapi: 3.0.3
info:
  title: FINatics Storefront API
  version: 1.0.0
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: API/database health
      responses:
        "200":
          description: Healthy
  /api/catalog/products:
    get:
      summary: List active products
      parameters:
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: Product list
  /api/catalog/products/{slug}:
    get:
      summary: Product detail with variants and live availability
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product }
        "404": { description: Not found }
  /api/checkout/validate:
    post:
      summary: Reprice and validate basket against live WMS availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [sku_id, qty]
                    properties:
                      sku_id: { type: string }
                      qty: { type: number }
      responses:
        "200": { description: Basket valid }
        "400": { description: Basket invalid }
  /api/checkout/quote:
    post:
      summary: Return currently allowed fulfilment choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, deliveryAddress]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [sku_id, qty]
                    properties:
                      sku_id: { type: string }
                      qty: { type: number }
                deliveryAddress:
                  type: object
                  properties:
                    postcode: { type: string }
                    country: { type: string }
      responses:
        "200": { description: Quote/options returned }
        "400": { description: Basket invalid }
  /api/orders:
    post:
      summary: Submit website order through WMS interface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idempotencyKey
                - items
                - customer
                - deliveryAddress
                - fulfilmentMethod
                - fulfilmentPreference
              properties:
                idempotencyKey:
                  type: string
                  description: Stable UUID/reference generated by storefront for retry safety
                items:
                  type: array
                  items:
                    type: object
                    required: [sku_id, qty]
                    properties:
                      sku_id: { type: string }
                      qty: { type: number }
                customer:
                  type: object
                  properties:
                    customerId: { type: string }
                    name: { type: string }
                    email: { type: string }
                    phone: { type: string }
                    mobile: { type: string }
                deliveryAddress:
                  type: object
                  properties:
                    name: { type: string }
                    address1: { type: string }
                    address2: { type: string }
                    town: { type: string }
                    county: { type: string }
                    postcode: { type: string }
                    country: { type: string }
                fulfilmentMethod:
                  type: string
                  enum: [CARRIER, LOCAL_DELIVERY, COLLECTION, ROUTE_DELIVERY, MEET_POINT]
                fulfilmentPreference:
                  type: string
                  enum: [CONSOLIDATE, SPLIT_WHEN_REQUIRED]
                serviceLevel:
                  type: string
      responses:
        "201": { description: Order accepted into WMS }
        "400": { description: Validation failure }
  /api/orders/{orderId}:
    get:
      summary: Customer-safe order/fulfilment status
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order status }
        "404": { description: Not found }
